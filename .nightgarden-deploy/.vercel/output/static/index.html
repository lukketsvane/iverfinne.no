  for (var i = 0; i < oct; i++) { v += vn(x * fr + i * 17.3) * a; n += a; a *= 0.5; fr *= 2.03; }
  return v / n;

function mound(x) {
  var m = 0, b = Math.floor(x / 235);

    if (h1(bi * 3.7) > 0.5) {

      var w = 36 + h1(bi * 5.3) * 44;

var heldL = false, heldR = false, heldRun = false, heldUp = false;

function doJump(variable) { jumpBuf = 0.14; jumpVariable = variable; }

window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') heldL = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') heldR = true;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') { if (!heldUp) doJump(true); heldUp = true; }
  else if (k === 'Shift') heldRun = true;
  else return;
  e.preventDefault();
}, { passive: false });

window.addEventListener('keyup', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') heldL = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') heldR = false;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') heldUp = false;
  else if (k === 'Shift') heldRun = false;
});
window.addEventListener('blur', function () {
  heldL = heldR = heldRun = heldUp = false; touches = {}; moveId = null;
});

stage.addEventListener('pointerdown', function (e) {
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  touches[e.pointerId] = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now(), j: false };
  if (moveId === null) moveId = e.pointerId;
  else { doJump(false); touches[e.pointerId].j = true; }
  e.preventDefault();
}, { passive: false });

stage.addEventListener('pointermove', function (e) {
  var t = touches[e.pointerId]; if (!t) return;
  t.x = e.clientX; t.y = e.clientY;
  if (!t.j && t.y0 - t.y > 24) { doJump(false); t.j = true; }
  e.preventDefault();
}, { passive: false });

function endPointer(e) {
  var t = touches[e.pointerId]; if (!t) return;
  var dt = performance.now() - t.t0;
  var d = Math.abs(t.x - t.x0) + Math.abs(t.y - t.y0);
  if (!t.j && dt < 240 && d < 18) {
    var wx = camX + (t.x - cv.getBoundingClientRect().left) * (IW / cv.getBoundingClientRect().width);
    var wy = camY + (t.y - cv.getBoundingClientRect().top) * (IH / cv.getBoundingClientRect().height);
    if (!scareFaunaAt(wx, wy)) doJump(false);

function readInput() {
  var axis = 0, top = WALK_V;

  if (heldR) axis += 1;
  if (axis !== 0) { top = heldRun ? RUN_V : WALK_V; }
  else if (moveId !== null) {
    var t = touches[moveId];
    if (t && performance.now() - t.t0 > 110) {
      var half = window.innerWidth / 2;
      var rel = (t.x - half) / (half * 0.70);
      if (rel > 1) rel = 1; if (rel < -1) rel = -1;
      var mag = Math.abs(rel);

  anim: 'idle', frame: 0, clock: 0, done: false,

};
P.y = surfaceY(0);

var ANIM = {
  idle:    { row: 0, f: [0, 1, 2, 3, 4, 5, 6, 7], fps: 6.5, loop: true },
  walk:    { row: 1, f: [0, 1, 2, 3, 4, 5, 6, 7], fps: 9, loop: true },
  run:     { row: 2, f: [0, 1, 2, 3, 4, 5, 6], fps: 14, loop: true },
  look:    { row: 3, f: [0, 1, 2, 3, 4, 5, 6, 7], fps: 5, loop: false },
  rise:    { row: 4, f: [1, 2, 3], fps: 9, loop: false },
  fall:    { row: 4, f: [4, 5], fps: 5, loop: false },
  land:    { row: 5, f: [0, 2, 4, 6], fps: 17, loop: false },
  stretch: { row: 7, f: [0, 1, 2, 3, 4, 5, 6, 7], fps: 7, loop: false }
};
function setAnim(n) { if (P.anim !== n) { P.anim = n; P.frame = 0; P.clock = 0; P.done = false; } }

var GRAV = 430, JUMP_V = -154, ACC = 250, FRIC = 320;

function physics(dt, inp) {
  if (inp.axis !== 0) {
    P.face = inp.axis;
    P.vx += inp.axis * ACC * dt;
    if (Math.abs(P.vx) > inp.top) P.vx = inp.axis * inp.top;
  } else {
    var f = FRIC * dt;
    if (Math.abs(P.vx) <= f) P.vx = 0; else P.vx -= (P.vx > 0 ? 1 : -1) * f;
  }

  if (jumpBuf > 0) jumpBuf -= dt;
  if (P.coyote > 0) P.coyote -= dt;

  if (jumpBuf > 0 && (P.grounded || P.coyote > 0)) {
    P.vy = JUMP_V; P.grounded = false; P.coyote = 0; jumpBuf = 0;
    P.held = jumpVariable; P.land = 0;
    setAnim('rise'); puff(P.x, P.y, 5, 0.45);
  }
  if (P.held && !heldUp && P.vy < -52) { P.vy = -52; P.held = false; }
  if (P.vy >= 0) P.held = false;

  P.vy += GRAV * dt;
  if (P.vy > 340) P.vy = 340;
  P.x += P.vx * dt;
  P.y += P.vy * dt;

  var g = surfaceY(P.x);
  if (P.y >= g) {
    if (!P.grounded) {
      var imp = P.vy;
      P.land = imp > 160 ? 0.30 : 0.15;
      setAnim('land'); puff(P.x, g, imp > 160 ? 9 : 4, 0.5);
    }
    P.grounded = true; P.y = g; P.vy = 0; P.coyote = 0.1;
  } else if (P.grounded) {

  }

function animate(dt) {
  var spd = Math.abs(P.vx);
  if (!P.grounded) {
    P.idleT = 0; P.fidget = null; P.land = 0;
    setAnim(P.vy < -18 ? 'rise' : 'fall');
  } else if (P.land > 0) {
    P.land -= dt; P.idleT = 0;
    if (spd > 10) P.land = 0;
  } else if (spd > 54) { setAnim('run'); P.idleT = 0; P.fidget = null; }
  else if (spd > 3) { setAnim('walk'); P.idleT = 0; P.fidget = null; }
  else {
    P.idleT += dt;
    if (P.fidget) { if (P.done) { P.fidget = null; P.idleT = 0; setAnim('idle'); } }
    else if (P.idleT > 7.5) { P.fidget = h1(P.x + P.idleT) < 0.6 ? 'look' : 'stretch'; setAnim(P.fidget); }
    else setAnim('idle');
  }

  var a = ANIM[P.anim], rate = a.fps;
  if (P.anim === 'walk') rate = 4.5 + spd * 0.20;
  else if (P.anim === 'run') rate = 8 + spd * 0.11;
  P.clock += dt * rate;
  while (P.clock >= 1) {
    P.clock -= 1;
    if (P.frame < a.f.length - 1) P.frame++;
    else if (a.loop) P.frame = 0; else P.done = true;
  }
}

}

var npcAtlas = new Image(), npcReady = false;
npcAtlas.onload = function () { npcReady = true; };
npcAtlas.src = NPC_ATLAS_SRC;
var NPC_OFF = { tit: 0, bugA: 256, bugB: 512 };
var CELL64 = 32;

function atlasRect(r, dx, dy) {
  ctx.drawImage(plantAtlas, r[0], r[1], r[2], r[3], dx, dy, r[2], r[3]);
}
function drawPlantAsset(r, sx, gy, sway, scale, flip) {
  if (!plantAtlasReady || !r) return;
  var w=r[2], h=r[3];
  ctx.save();
  ctx.translate(Math.round(sx), Math.round(gy));
  // The Figma components are authored horizontally from a shared centre anchor.
  // Rotate them into the side-view garden without resampling.
  ctx.rotate(-Math.PI/2 + sway);
  if (flip) ctx.scale(1,-1);
  ctx.scale(scale,scale);
  ctx.drawImage(plantAtlas,r[0],r[1],w,h,-(w>>1),-h,w,h);
  ctx.restore();
}
function drawRootAsset(r, sx, gy, flip) {
  if (!plantAtlasReady || !r) return;
  var w=r[2], h=r[3];
  ctx.save();
  ctx.translate(Math.round(sx), Math.round(gy+2));
  if (flip) ctx.scale(-1,1);
  ctx.globalAlpha=0.76;
  ctx.drawImage(plantAtlas,r[0],r[1],w,h,-(w>>1),0,w,h);
  ctx.restore(); ctx.globalAlpha=1;
}
function drawSeedAsset(r, sx, sy) {
  if (!plantAtlasReady || !r) return;
  ctx.drawImage(plantAtlas,r[0],r[1],r[2],r[3],Math.round(sx-r[2]/2),Math.round(sy),r[2],r[3]);
}

var smallFauna=[];
function makeTit(x) { return {kind:'tit',x:x,y:surfaceY(x),vx:0,vy:0,face:h1(x*2.1)>.5?1:-1,st:'ground',row:0,frame:0,clock:0,act:1+h1(x*1.7)*2,tx:x,cruise:0}; }
function makeBug(x,k) { return {kind:k,x:x,y:surfaceY(x),vx:(h1(x*2.9)>.5?1:-1)*(4+h1(x)*5),face:1,row:1,frame:0,clock:h1(x*8),roll:0}; }
function ensureFauna() {
  if (smallFauna.length) return;
  smallFauna.push(makeTit(P.x-92),makeTit(P.x+178));
  smallFauna.push(makeBug(P.x-52,'bugA'),makeBug(P.x+66,'bugB'),makeBug(P.x+214,'bugA'));
}
function scareFaunaAt(wx,wy) {
  for (var i=0;i<crows.length;i++) { var c=crows[i]; if(Math.abs(c.x-wx)<28 && Math.abs(c.y-wy)<30) { crowFlyTo(c,c.x+(c.x<wx?-1:1)*(110+Math.random()*120)); c.calm=5; return true; } }
  for (var j=0;j<smallFauna.length;j++) {
    var a=smallFauna[j];
    if (Math.abs(a.x-wx)>24 || Math.abs(a.y-wy)>24) continue;
    if (a.kind==='tit') { a.st='takeoff'; a.row=4; a.frame=0; a.clock=0; a.face=(a.x<wx?-1:1); a.tx=a.x+a.face*(90+Math.random()*150); a.cruise=surfaceY(a.x)-42-Math.random()*36; }
    else { a.roll=1.15; a.row=3; a.frame=0; a.clock=0; a.vx=(a.x<wx?-1:1)*(17+Math.random()*13); }
    return true;
  }
  return false;
}
function updateSmallFauna(dt) {
  ensureFauna();
  for (var i=0;i<smallFauna.length;i++) {
    var a=smallFauna[i];
    if (Math.abs(a.x-P.x)>IW*1.8) {
      var side=Math.random()<.5?-1:1;
      smallFauna[i]=a=(a.kind==='tit'?makeTit(P.x+side*(IW*.7+Math.random()*IW*.4)):makeBug(P.x+side*(IW*.7+Math.random()*IW*.4),a.kind));
    }
    if (a.kind==='tit') {
      if (a.st==='ground') {
        a.act-=dt; a.y=surfaceY(a.x);
        if (a.act<=0) { var r=Math.random(); a.row=r<.48?0:(r<.78?1:3); a.act=.8+Math.random()*2.1; if(r>.48) { if(Math.random()<.35)a.face=-a.face; a.x+=a.face*2; } }
        if (Math.abs(a.x-P.x)<24 && (Math.abs(P.vx)>9 || !P.grounded)) { a.st='takeoff'; a.row=4; a.frame=0; a.clock=0; a.face=a.x<P.x?-1:1; a.tx=a.x+a.face*(100+Math.random()*130); a.cruise=surfaceY(a.x)-40-Math.random()*32; }
      } else if (a.st==='takeoff') {
        if (a.frame>=2) { a.st='fly'; a.row=6; a.vx=a.face*48; a.vy=-70; }
      } else if (a.st==='fly') {
        a.vx+=(a.face*60-a.vx)*2.1*dt; a.vy+=(((a.y>a.cruise)?-54:13)-a.vy)*2.4*dt; a.x+=a.vx*dt; a.y+=a.vy*dt;
        if ((a.face>0&&a.x>a.tx-24)||(a.face<0&&a.x<a.tx+24)) { a.st='descend'; a.row=7; }
      } else {
        a.vx+=(a.face*24-a.vx)*2*dt; a.vy+=(48-a.vy)*2.4*dt; a.x+=a.vx*dt; a.y+=a.vy*dt; var g=surfaceY(a.x);
        if(a.y>=g){a.y=g;a.vx=a.vy=0;a.st='ground';a.row=0;a.act=.5;}
      }
      var fps=a.st==='ground'?(a.row===0?5:(a.row===3?8:10)):12;
      a.clock+=dt*fps; while(a.clock>=1){a.clock-=1;a.frame=(a.frame+1)&7;}
    } else {
      if(a.roll>0){a.roll-=dt;if(a.roll<=0)a.row=1;}
      a.x+=a.vx*dt; a.y=surfaceY(a.x); a.face=a.vx<0?-1:1;
      if(Math.abs(a.x-P.x)<14 && Math.abs(P.vx)>8){a.vx=(a.x<P.x?-1:1)*(12+Math.random()*10);a.roll=.7;a.row=3;}
      a.vx*=Math.pow(.997,dt*60); if(Math.abs(a.vx)<2.2)a.vx=a.face*(2.8+h1(a.x)*3.2);
      a.clock+=dt*(a.roll>0?11:7); while(a.clock>=1){a.clock-=1;a.frame=(a.frame+1)&7;}
    }
  }
}
function drawSmallFauna() {
  if(!npcReady)return;
  for(var i=0;i<smallFauna.length;i++){
    var a=smallFauna[i],sx=Math.round(a.x-camX),sy=Math.round(a.y-camY); if(sx<-36||sx>IW+36)continue;
    var off=NPC_OFF[a.kind],row=a.row,fr=a.frame,dx=sx-16,dy=sy-28;
    if(a.kind!=='tit')dy=sy-17;
    if(a.face<0){ctx.save();ctx.translate(dx+32,dy);ctx.scale(-1,1);ctx.drawImage(npcAtlas,off+fr*32,row*32,32,32,0,0,32,32);ctx.restore();}
    else ctx.drawImage(npcAtlas,off+fr*32,row*32,32,32,dx,dy,32,32);
  }
}

var crowImg = new Image(), crowReady = false;
crowImg.onload = function () { crowReady = true; };
crowImg.src = CROW_SRC;

var CA = {
  idle:    { row: 0, n: 8, fps: 4.5, loop: true },
  hop:     { row: 1, n: 8, fps: 13, loop: true },
  strut:   { row: 2, n: 8, fps: 10, loop: true },
  peck:    { row: 3, n: 8, fps: 7, loop: true },
  takeoff: { row: 4, n: 8, fps: 17, loop: false },
  fly:     { row: 5, n: 8, fps: 13, loop: true },
  glide:   { row: 6, n: 8, fps: 4, loop: true }
};

var crows = [];
function setCA(c, n) { if (c.anim !== n) { c.anim = n; c.frame = 0; c.clock = 0; c.done = false; } }

function makeCrow(x) {
  var c = {
    x: x, y: surfaceY(x), vx: 0, vy: 0, face: h1(x * 1.7) > 0.5 ? 1 : -1,
    st: 'ground', anim: 'idle', frame: (h1(x * 5.1) * 8) | 0, clock: 0, done: false,
    act: 0, actT: 0.6 + h1(x * 3.3) * 2.4, tx: x, cruise: 0, calm: 0
  };
  return c;
}

function pickAction(c) {
  var r = Math.random();
  if (r < 0.36) { c.act = 0; setCA(c, 'idle'); c.actT = 1.4 + Math.random() * 2.8; }
  else if (r < 0.70) { c.act = 1; setCA(c, 'peck'); c.actT = 1.2 + Math.random() * 2.4; }
  else if (r < 0.89) { c.act = 2; setCA(c, 'hop'); c.actT = 0.35 + Math.random() * 0.5; if (Math.random() < 0.4) c.face = -c.face; }
  else { c.act = 3; setCA(c, 'strut'); c.actT = 0.7 + Math.random() * 1.4; if (Math.random() < 0.3) c.face = -c.face; }
}

function crowFlyTo(c, tx) {
  c.st = 'takeoff'; setCA(c, 'takeoff');
  c.tx = tx;
  c.face = tx > c.x ? 1 : -1;
  c.vx = 0; c.vy = 0;
  c.cruise = surfaceY((c.x + tx) * 0.5) - (32 + Math.random() * 44);
}

function updateCrows(dt) {
  if (!crows.length) for (var s0 = 0; s0 < 5; s0++) crows.push(makeCrow(P.x + (s0 - 2) * 135 + h1(s0 * 7.1) * 70));

  for (var i = 0; i < crows.length; i++) {
    var c = crows[i];

    if (Math.abs(c.x - P.x) > IW * 1.7) {
      var side = Math.random() < 0.5 ? -1 : 1;
      crows[i] = makeCrow(P.x + side * (IW * 0.62 + Math.random() * IW * 0.55));
      continue;
    }

    if (c.st === 'ground') {
      c.actT -= dt;
      if (c.act === 2) c.x += c.face * 26 * dt;
      else if (c.act === 3) c.x += c.face * 13 * dt;
      c.y = surfaceY(c.x);
      if (c.actT <= 0) pickAction(c);
      if (c.calm <= 0) {
        var d = Math.abs(c.x - P.x);
        if (d < 34 && (Math.abs(P.vx) > 8 || !P.grounded)) {
          crowFlyTo(c, c.x + (c.x < P.x ? -1 : 1) * (95 + Math.random() * 150));
          c.calm = 5;
        } else if (Math.random() < dt * 0.04) {
          crowFlyTo(c, c.x + (Math.random() < 0.5 ? -1 : 1) * (75 + Math.random() * 165));
        }
      }
    } else if (c.st === 'takeoff') {
      if (c.frame >= 2) { c.vy = -80; c.vx = c.face * 48; c.st = 'fly'; setCA(c, 'fly'); }
    } else if (c.st === 'fly') {
      c.vx += (c.face * 64 - c.vx) * 2.2 * dt;
      c.vy += (((c.y > c.cruise) ? -66 : 16) - c.vy) * 2.6 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      if ((c.face > 0 && c.x > c.tx - 36) || (c.face < 0 && c.x < c.tx + 36)) { c.st = 'descend'; setCA(c, 'glide'); }
    } else if (c.st === 'descend') {
      c.vx += (c.face * 28 - c.vx) * 2.0 * dt;
      c.vy += (54 - c.vy) * 2.4 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      var g = surfaceY(c.x);
      if (c.y >= g) {
        c.y = g; c.vx = 0; c.vy = 0; c.st = 'ground';
        setCA(c, 'hop'); c.act = 0; c.actT = 0.3;
        puff(c.x, g, 3, 0.35);
      }
    }
    if (c.calm > 0) c.calm -= dt;

    var a = CA[c.anim];
    c.clock += dt * a.fps;
    while (c.clock >= 1) {
      c.clock -= 1;
      if (c.frame < a.n - 1) c.frame++;
      else if (a.loop) c.frame = 0; else c.done = true;
    }
  }
}

function drawCrows() {
  if (!crowReady) return;
  for (var i = 0; i < crows.length; i++) {
    var c = crows[i];
    var sx = Math.round(c.x - camX), sy = Math.round(c.y - camY);
    if (sx < -36 || sx > IW + 36) continue;
    var gy = Math.round(surfaceY(c.x) - camY);
    var lift = Math.max(0, Math.min(1, (gy - sy) / 60));
    var w = Math.round(9 - lift * 6);
    if (gy > -4 && gy < IH + 4 && w > 1) {
      ctx.fillStyle = 'rgba(10,14,10,' + (0.36 - lift * 0.26).toFixed(2) + ')';
      ctx.fillRect(sx - (w >> 1), gy, w, 1);
    }
    var a = CA[c.anim], dx = sx - CELL / 2, dy = sy - 28;
    if (c.face < 0) {
      ctx.save(); ctx.translate(dx + CELL, dy); ctx.scale(-1, 1);
      ctx.drawImage(crowImg, c.frame * CELL, a.row * CELL, CELL, CELL, 0, 0, CELL, CELL);
      ctx.restore();
    } else {
      ctx.drawImage(crowImg, c.frame * CELL, a.row * CELL, CELL, CELL, dx, dy, CELL, CELL);
    }
  }
}

/* an occasional flock crossing the middle distance */
var flock = [], flockT = 12 + Math.random() * 22, flockClock = 0;
function updateFlock(dt) {
  flockClock += dt;
  if (!flock.length) {
    flockT -= dt;
    if (flockT <= 0) {
      var dir = Math.random() < 0.5 ? 1 : -1;
      var n = 3 + ((Math.random() * 3) | 0);
      var baseY = HY - 150 + Math.random() * 46;
      for (var i = 0; i < n; i++) flock.push({
        x: dir > 0 ? -44 - i * (28 + Math.random() * 24) : IW + 44 + i * (28 + Math.random() * 24),
        y: baseY + (Math.random() - 0.5) * 28,
        vx: dir * (26 + Math.random() * 12), ph: Math.random() * 6.28, dir: dir
      });
      flockT = 48 + Math.random() * 75;
    }
  } else {
    for (var j = flock.length - 1; j >= 0; j--) {
      var f = flock[j];
      f.x += f.vx * dt;
      f.y += Math.sin(flockClock * 0.7 + f.ph) * 7 * dt;
      if (f.dir > 0 ? f.x > IW + 54 : f.x < -54) flock.splice(j, 1);
    }
  }
}
function drawFlock() {
  if (!crowReady || !flock.length) return;
  ctx.globalAlpha = 0.82;
  for (var i = 0; i < flock.length; i++) {
    var f = flock[i];
    var fr = ((flockClock * 9 + f.ph * 2) | 0) % 8;
    var dx = Math.round(f.x) - CELL / 2, dy = Math.round(f.y) - 16;
    if (f.dir < 0) {
      ctx.save(); ctx.translate(dx + CELL, dy); ctx.scale(-1, 1);
      ctx.drawImage(crowImg, fr * CELL, 5 * CELL, CELL, CELL, 0, 0, CELL, CELL);
      ctx.restore();
    } else {
      ctx.drawImage(crowImg, fr * CELL, 5 * CELL, CELL, CELL, dx, dy, CELL, CELL);
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------- camera */
var camX = 0, camY = 0, started = false;

/* ---------------------------------------------------------------- draw */
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }

var starStrip = null;
function buildStarStrip() {
  if (starStrip || !ready(IMG.stars)) return;
  var w = IMG.stars.naturalWidth, h = IMG.stars.naturalHeight, n = TWINKLE.px[0][2].length;
  var c = document.createElement('canvas'); c.width = w; c.height = h * n;
  var x = c.getContext('2d');
  for (var f = 0; f < n; f++) {
    x.drawImage(IMG.stars, 0, f * h);
    for (var i = 0; i < TWINKLE.px.length; i++) {
      var p = TWINKLE.px[i];
      x.fillStyle = TWINKLE.pal[p[2][f]];
      x.fillRect(p[0], f * h + p[1], 1, 1);
    }
  }
  starStrip = c;
}

function drawSky(t, hy) {
  ctx.fillStyle = SKY; ctx.fillRect(0, 0, IW, IH);
  buildStarStrip();
  if (!starStrip) return;
  var w = IMG.stars.naturalWidth, h = IMG.stars.naturalHeight, n = starStrip.height / h;
  var base = Math.floor(t / 0.07);
  var off = Math.round(camX * 0.02);
  var rows = Math.ceil(hy / h) + 1;
  for (var r = 0; r < rows; r++) {
    var y = hy - (r + 1) * h + 40;
    if (y > IH || y + h < 0) continue;
    var f = (base + r * 11) % n;
    var ro = off + r * 173;
    var x0 = -(((ro % w) + w) % w);
    for (var x = x0; x < IW; x += w) ctx.drawImage(starStrip, 0, f * h, w, h, x, y, w, h);
  }
}

function disc(cx, cy, r, col) {
  ctx.fillStyle = col;
  for (var dx = -r; dx <= r; dx++) {
    var dy = Math.sqrt(r * r - dx * dx) | 0;
    if (dy <= 0) continue;
    ctx.fillRect((cx + dx) | 0, (cy - dy) | 0, 1, dy * 2);
  }
}

function drawMoon(hy) {
  var span = IW + 900;
  var mx = (IW * 0.72 - camX * 0.012) % span;
  if (mx < -60) mx += span;
  var my = Math.max(12, hy - 196);
  disc(mx, my, 10, 'rgba(223,230,234,0.05)');
  disc(mx, my, 6, '#dfe6ea');
  ctx.fillStyle = 'rgba(150,158,164,0.55)';
  ctx.fillRect((mx - 3) | 0, (my - 2) | 0, 2, 2);
  ctx.fillRect((mx + 1) | 0, (my + 1) | 0, 2, 2);
}

function drawTiled(im, par, hy, mirror, baseCol) {
  if (!ready(im)) return;
  var w = im.naturalWidth, h = im.naturalHeight;
  var off = Math.round(camX * par), y = hy - h;
  for (var i = Math.floor(off / w); i * w - off < IW; i++) {
    var x = i * w - off;
    if (mirror && (i & 1)) {
      ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0); ctx.restore();
    } else ctx.drawImage(im, x, y);
  }
  if (hy < IH) { ctx.fillStyle = baseCol; ctx.fillRect(0, hy, IW, IH - hy); }
}

function blobs(list, col) {
  ctx.fillStyle = col;
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    var x0 = Math.max(0, Math.ceil(b.x - b.r)), x1 = Math.min(IW - 1, Math.floor(b.x + b.r));
    for (var x = x0; x <= x1; x++) {
      var dx = x - b.x, hh = Math.sqrt(Math.max(0, b.r * b.r - dx * dx));
      if (hh < 0.7) continue;
      ctx.fillRect(x, (b.y - hh) | 0, 1, (hh * 2) | 0);
    }
  }
}

function drawClouds(hy, t) {
  var im = IMG.clouds; if (!ready(im)) return;
  var w = im.naturalWidth, h = im.naturalHeight, period = 820;
  var off = camX * 0.5 + t * 2.2;
  ctx.globalAlpha = 0.5;
  for (var i = Math.floor((off - w - 140) / period); i * period - off < IW; i++) {
    var x = Math.round(i * period + h1(i * 3.1) * 120 - off);
    if (x + w < 0) continue;
    var y = hy - h + 8 + Math.round(h1(i * 7.7) * 12);
    if (h1(i * 5.3) > 0.5) {
      ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0); ctx.restore();
    } else ctx.drawImage(im, x, y);
  }
  ctx.globalAlpha = 1;
}

var groundPat = null;
function drawGround() {
  var cxr = Math.round(camX), cyr = Math.round(camY);
  if (!groundPat && ready(IMG.ground)) groundPat = ctx.createPattern(IMG.ground, 'repeat');
  var fill = C.gBase;
  if (groundPat && groundPat.setTransform && window.DOMMatrix) {
    groundPat.setTransform(new DOMMatrix([1, 0, 0, 1, -(((cxr % 12) + 12) % 12), -(((cyr % 12) + 12) % 12)]));
    fill = groundPat;
  }
  for (var sx = 0; sx < IW; sx++) {
    var wx = cxr + sx;
    var iy = Math.round(surf[sx + 5]) - cyr;
    if (iy > IH) continue;
    var y0 = Math.max(0, iy);
    ctx.fillStyle = fill; ctx.fillRect(sx, y0, 1, IH - y0);
    if (iy >= 0) { rect(sx, iy, 1, 1, C.gLit); rect(sx, iy + 1, 1, 1, C.gTop); }

  }
}

function drawGrass(t) {
  var cxr = Math.round(camX), cyr = Math.round(camY);
  for (var sx = 0; sx < IW; sx++) {
    var wx = cxr + sx;
    var r = h1(wx * 12.9898);
    if (r > 0.26) continue;
    var gy = Math.round(surf[sx + 5]) - cyr;
    if (gy < -6 || gy > IH + 2) continue;
    var h = 1 + ((h1(wx * 3.71) * 3) | 0);
    var sway = Math.sin(t * 1.15 + wx * 0.21) * 0.8;
    var near = Math.abs(wx - P.x);
    if (near < 9 && Math.abs(P.vx) > 4) sway += (P.vx > 0 ? -1 : 1) * (9 - near) * 0.22;
    var col = r < 0.15 ? C.stemLit : C.stem;
    for (var i = 0; i < h; i++) rect(sx + Math.round(sway * (i / h)), gy - 1 - i, 1, 1, col);
  }
}

function drawFigmaPlants(t) {
  if (!plantAtlasReady) return;
  var cyr=Math.round(camY);
  var b0=Math.floor(camX/34)-2, n=Math.ceil(IW/34)+5;
  for(var k=0;k<n;k++){
    var b=b0+k;
    if(h1(b*17.31)>.78)continue;
    var wx=b*34+Math.round(h1(b*5.17)*27);
    var sx=Math.round(wx-camX); if(sx<-42||sx>IW+42)continue;
    var gy=Math.round(surfaceY(wx))-cyr; if(gy<-50||gy>IH+10)continue;
    var fi=(h1(b*2.71)*8)|0, family=PA.fam[fi];
    var flower=h1(b*9.43)>.37 && family.f.length;
    var pool=flower?family.f:family.s; if(!pool.length)continue;
    var ri=(h1(b*11.73)*pool.length)|0, r=pool[Math.min(ri,pool.length-1)];
    var sway=Math.sin(t*(.42+h1(b)*.42)+b)*.025;
    var near=Math.abs(wx-P.x); if(near<18&&Math.abs(P.vx)>4)sway+=(P.vx>0?-1:1)*(18-near)*.0032;
    var sc=1;
    drawRootAsset(PA.roots[(Math.abs(b)+fi*3)%PA.roots.length],sx,gy,(b&1));
    drawPlantAsset(r,sx,gy,sway,sc,(h1(b*4.4)>.5));
    // A few intact Figma seed assets remain buried around the root zone.
    if(h1(b*31.1)>.76){var sr=PA.icons[(Math.abs(b*5+fi))%PA.icons.length];drawSeedAsset(sr,sx+((b&1)?7:-7),gy+10+((h1(b*6.9)*24)|0));}
  }
  // pumpkins are rare landmarks, using all four original lamp states.
  var p0=Math.floor(camX/430)-1;
  for(var j=0;j<Math.ceil(IW/430)+3;j++){
    var pb=p0+j; if(h1(pb*7.17)<.66)continue;
    var pw=pb*430+70+h1(pb*3.7)*290, ps=Math.round(pw-camX), pg=Math.round(surfaceY(pw))-cyr;
    if(ps<-40||ps>IW+40)continue;
    var pr=PA.pumpkin[((t*2+Math.abs(pb))|0)%PA.pumpkin.length];
    ctx.drawImage(plantAtlas,pr[0],pr[1],pr[2],pr[3],ps-(pr[2]>>1),pg-pr[3]+2,pr[2],pr[3]);
  }
}

function drawPlayer() {
  var px = Math.round(P.x - camX), py = Math.round(P.y - camY);
  var gy = Math.round(surfaceY(P.x) - camY);
  var lift = Math.max(0, Math.min(1, (gy - py) / 46));
  var sw = Math.round(9 - lift * 5);
  ctx.fillStyle = 'rgba(10,14,10,' + (0.40 - lift * 0.26).toFixed(2) + ')';
  ctx.fillRect(px - (sw >> 1), gy, sw, 1);
  if (sw > 3) ctx.fillRect(px - (sw >> 1) + 1, gy + 1, sw - 2, 1);

  if (!sheetReady) return;
  var a = ANIM[P.anim], fr = a.f[Math.min(P.frame, a.f.length - 1)];
  var dx = px - CELL / 2, dy = py - CELL + 1;
  if (P.face < 0) {
    ctx.save(); ctx.translate(dx + CELL, dy); ctx.scale(-1, 1);
    ctx.drawImage(sheet, fr * CELL, a.row * CELL, CELL, CELL, 0, 0, CELL, CELL);
    ctx.restore();
  } else {
    ctx.drawImage(sheet, fr * CELL, a.row * CELL, CELL, CELL, dx, dy, CELL, CELL);
  }
}

function drawParts() {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i], a = Math.max(0, p.l / p.m);
    ctx.fillStyle = 'rgba(146,160,136,' + (a * 0.5).toFixed(2) + ')';
    ctx.fillRect(Math.round(p.x - camX), Math.round(p.y - camY) - 1, 1, 1);
  }
}

function drawFlies(t) {
  for (var i = 0; i < flies.length; i++) {
    var f = flies[i];
    var cx = P.x + f.ax + Math.sin(t * f.sp + f.ph) * f.r * 2.0;
    var cy = surfaceY(cx) + f.ay + Math.cos(t * f.sp * 1.37 + f.ph) * f.r * 0.5;
    var sx = Math.round(cx - camX), sy = Math.round(cy - camY);
    if (sx < 0 || sx > IW || sy < 0 || sy > IH) continue;
    var bl = Math.sin(t * 1.8 + f.bl);
    if (bl < 0.15) continue;
    var a = Math.min(1, (bl - 0.15) * 1.6);
    var col = f.hue < 0.6 ? '228,216,142' : '188,220,168';
    ctx.fillStyle = 'rgba(' + col + ',' + (a * 0.16).toFixed(2) + ')';
    ctx.fillRect(sx - 1, sy, 3, 1); ctx.fillRect(sx, sy - 1, 1, 3);
    ctx.fillStyle = 'rgba(' + col + ',' + a.toFixed(2) + ')';
    ctx.fillRect(sx, sy, 1, 1);
  }
}

function drawForeground(t) {
  var cx = camX * 1.55, period = 215;
  var b0 = Math.floor(cx / period) - 1;
  var list = [];
  for (var k = 0; k <= Math.ceil(IW / period) + 2; k++) {
    var bi = b0 + k;
    if (h1(bi * 4.41) < 0.48) continue;
    var gx = bi * period + h1(bi * 8.2) * 152 - cx;
    if (gx < -130 || gx > IW + 130) continue;
    for (var j = 0; j < 4; j++) list.push({
      x: gx + (h2(bi, j + 30) - 0.5) * 64,
      y: IH + 9 - h2(bi, j + 40) * 15,
      r: 12 + h2(bi, j + 50) * 22
    });
  }
  blobs(list, '#0f1214');
  for (var sx = 0; sx < IW; sx++) {
    var wx = Math.round(sx + cx);
    if (h1(wx * 6.11) > 0.09) continue;
    var h = 4 + ((h1(wx * 2.13) * 9) | 0);
    var sway = Math.sin(t * 0.9 + wx * 0.17) * 1.4;
    for (var i = 0; i < h; i++) {
      var f = i / h;
      rect(sx + Math.round(sway * f * f), IH - 1 - i, 1, 1, '#0d1012');
    }
  }
}

var vig = null, vigH = 0;
function drawVignette() {
  if (!vig || vigH !== IH) {
    vig = ctx.createLinearGradient(0, 0, 0, IH);
    vig.addColorStop(0, 'rgba(4,5,9,0.32)');
    vig.addColorStop(0.44, 'rgba(4,5,9,0)');
    vig.addColorStop(1, 'rgba(4,5,9,0.30)');
    vigH = IH;
  }
  ctx.fillStyle = vig; ctx.fillRect(0, 0, IW, IH);
}

/* ---------------------------------------------------------------- loop */
var last = 0, tSec = 0, stepAcc = 0;

function frame(now) {
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  tSec += dt;

  var inp = readInput();
  physics(dt, inp);
  animate(dt);
  updateParts(dt);
  updateCrows(dt);
  updateSmallFauna(dt);
  updateFlock(dt);

  if (P.grounded && Math.abs(P.vx) > 20) {
    stepAcc += Math.abs(P.vx) * dt;
    if (stepAcc > 13) { stepAcc = 0; if (Math.random() < 0.7) stepDust(); }
  } else stepAcc = 0;

  var look = P.face * Math.min(26, Math.abs(P.vx) * 0.30);
  var tx = P.x - IW * 0.5 + look, ty = P.y - ANCHOR;
  if (!started) { camX = tx; camY = ty; started = true; }
  camX += (tx - camX) * (1 - Math.pow(0.0026, dt));
  camY += (ty - camY) * (1 - Math.pow(0.012, dt));

  var fx = camX, fy = camY;
  camX = Math.round(camX); camY = Math.round(camY);
  buildSurfCache();

  var hy = HY = ANCHOR + 6;
  drawSky(tSec, hy);
  drawMoon(hy);
  drawTiled(IMG.mtn, 0.10, hy, true, MTN_BASE);
  drawFlock();
  drawTiled(IMG.forest, 0.35, hy, false, FOREST_BASE);
  drawClouds(hy, tSec);
  drawGround();
  drawGrass(tSec);
  drawFigmaPlants(tSec);
  drawParts();
  drawCrows();
  drawSmallFauna();
  drawPlayer();
  drawFlies(tSec);
  drawForeground(tSec);
  drawVignette();

  camX = fx; camY = fy;
  requestAnimationFrame(frame);
}

function start(saved) {
  if (!saved || typeof saved.x !== 'number') {
    try { var lx=+window.localStorage.getItem('max-night-garden-x'); if(isFinite(lx)) saved={x:lx}; } catch(e) {}
  }
  if (saved && typeof saved.x === 'number' && isFinite(saved.x)) P.x = saved.x;
  P.y = surfaceY(P.x);
  resize();
  last = performance.now();
  setInterval(function(){ try { localStorage.setItem('max-night-garden-x',String(Math.round(P.x*10)/10)); } catch(e){} }, 2500);
  requestAnimationFrame(frame);
}

if (window.claude && window.claude.hot) {
  try { window.claude.hot.snapshot(function () { return { x: P.x }; }); } catch (e) {}
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
