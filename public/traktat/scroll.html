<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORMLÆRE">
<title>FORMLÆRE — Iver Raknes Finne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..400;1,7..72,300..400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --bg:#FFFFFF;
  --fg:#000000;
  --dim:#767676;
  --line:#D2D2D2;
  --hair:#E8E8E8;
  --serif:"Literata",Charter,Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#FFFFFF; --dim:#7C7C7C; --line:#343434; --hair:#1C1C1C;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#FFFFFF; --dim:#7C7C7C; --line:#343434; --hair:#1C1C1C;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{
  height:100%;margin:0;background:var(--bg);color:var(--fg);
  overflow:hidden;overscroll-behavior:none;
  touch-action:pan-y;
}
body{
  font-family:var(--serif);font-size:.90625rem;line-height:1.52;
  font-weight:350;font-optical-sizing:none;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
}

.app{
  height:100vh;height:100dvh;
  max-width:520px;margin:0 auto;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
  border-left:1px solid var(--hair);border-right:1px solid var(--hair);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (max-width:522px){.app{border:0}}

/* ---- top ---- */
.bar{
  padding:calc(var(--top) + 10px) 16px 7px;
  font-family:var(--mono);font-size:9px;letter-spacing:.19em;color:var(--dim);
}

/* ---- tree strip ---- */
.strip{padding:1px 14px 8px;border-bottom:1px solid var(--hair)}
.strip svg{display:block;width:100%;height:auto;overflow:visible;touch-action:none}
.strip{-webkit-user-select:none;user-select:none}
.rbar{stroke:var(--line);stroke-width:1.1;fill:none;stroke-linecap:round}
.rbar.on{stroke:var(--dim)}
.stem{stroke:var(--line);stroke-width:.9;fill:none}
.stem.sec{stroke:var(--dim)}
.stem.on{stroke:var(--fg);stroke-width:1.2}
.dot{fill:var(--fg)}
.rlab{font-family:var(--mono);font-size:9px;fill:var(--dim);text-anchor:middle}
.rlab.on{fill:var(--fg)}
.tap{fill:transparent}


/* ---- reading / continuous stream ---- */
.read{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 .5rem 1.5rem 1rem;scroll-behavior:auto;touch-action:pan-y}
.read:focus-visible{outline:1px solid var(--dim);outline-offset:-1px}
.stream{padding:.375rem 0 1.25rem}
.doc-title{font-family:var(--serif);font-size:2rem;line-height:1.12;letter-spacing:-.025em;font-weight:400;margin:2.25rem 0 .7rem}
.section-title{font-family:var(--serif);font-size:1.15rem;font-weight:400;line-height:1.3;margin:2.4rem 0 .8rem;padding-top:.65rem;border-top:1px solid var(--hair);scroll-margin-top:12px}
.plain-paragraph{font-size:.89rem;line-height:1.62;font-weight:350;white-space:pre-line;margin:.72rem 0;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.plain-paragraph em,.prop em{font-style:italic}.plain-paragraph strong,.prop strong{font-weight:600}
.prop{position:relative;display:grid;grid-template-columns:3rem minmax(0,1fr);gap:0 .35rem;align-items:start;width:100%;min-width:0;font-size:.91rem;line-height:1.56;font-weight:350;padding:.36rem 0;scroll-margin-top:12px}
.prop .n{font-family:var(--mono);font-size:.66rem;line-height:1.45;padding-top:.17rem;color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left}
.prop .status{font-size:.58rem;margin-left:.05rem;font-weight:400}
.prop .t{font:inherit;min-width:0;width:100%;letter-spacing:0;text-wrap:pretty;text-align:left;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;-webkit-user-select:text;user-select:text}
.prop-paragraph{white-space:pre-line;margin:0;max-width:none}.prop-paragraph+.prop-paragraph{margin-top:.65em}
/* One fixed left edge for every proposition. Depth is communicated by
   the interactive proposition tree above the text, never by indentation. */
.prop.depth0{margin-left:0;font-size:1.08rem;line-height:1.48;font-weight:400;margin-top:3.2rem;padding-top:.25rem}
.prop.depth1{margin-left:0;font-size:.97rem;margin-top:1.05rem}
.prop.depth2{margin-left:0;margin-top:.54rem}
.prop.depth3{margin-left:0;margin-top:.3rem}
.prop.depth4{margin-left:0;margin-top:.21rem}
.prop.active .n{color:var(--fg);font-weight:500}
.endmark{padding:2rem 0 1rem;text-align:center;font-family:var(--mono);font-size:.61rem;letter-spacing:.16em;color:var(--dim)}

/* References are in-text, and the preview is anchored to the number. */
.xref{
  display:inline;color:inherit;background:transparent;border:0;border-radius:0;
  margin:0;padding:0;font:inherit;line-height:inherit;cursor:pointer;vertical-align:baseline;
  text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--dim);
  text-decoration-thickness:1px;text-underline-offset:.16em;touch-action:manipulation;
  -webkit-appearance:none;-webkit-tap-highlight-color:transparent;
}
.xref:hover,.xref:focus-visible,.xref.previewing{
  text-decoration-style:solid;text-decoration-color:var(--fg);
}
.xref:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.prop-preview{
  position:fixed;z-index:9999;box-sizing:border-box;
  width:min(350px,calc(100vw - 24px));padding:12px 14px;
  color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.17);
  pointer-events:none;font-family:var(--serif);font-size:.86rem;line-height:1.48;
  text-align:left;overflow-wrap:break-word;
}
.prop-preview[hidden]{display:none!important}
.prop-preview-num{font-family:var(--mono);font-size:.75rem;font-weight:500;margin-bottom:6px}
.prop-preview-body{white-space:pre-line;max-height:min(32vh,240px);overflow:hidden}
.prop-preview-hint{font-family:var(--mono);font-size:.64rem;color:var(--dim);padding-top:9px}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .prop-preview{box-shadow:0 8px 30px rgba(0,0,0,.6)}
}
:root[data-theme="dark"] .prop-preview{box-shadow:0 8px 30px rgba(0,0,0,.6)}

/* Text remains selectable while the reader behaves like a fixed-scale iPhone app. */
@supports (-webkit-touch-callout: none){
  .read{overscroll-behavior-y:contain}
}

/* ---- pager ---- */
.pager{
  display:grid;grid-template-columns:64px 1fr 64px;align-items:center;
  border-top:1px solid var(--hair);
  padding-bottom:var(--bot);
}
.pager button{
  height:48px;background:none;border:0;color:var(--fg);
  font-family:var(--serif);font-size:23px;line-height:1;
  touch-action:manipulation;-webkit-appearance:none;
}
.pager button:focus-visible{outline:1px solid var(--dim);outline-offset:-6px}
.pager button:disabled{color:var(--hair)}
.pager button:active:not(:disabled){background:var(--hair)}
.pos{
  text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--dim);
  font-variant-numeric:tabular-nums;letter-spacing:.06em;
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .read{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">FORMLÆRE</div>
  <div class="strip"><svg id="tree" role="img" aria-label="Traktatens tre"></svg></div>
  <main class="read" id="read" tabindex="0" aria-label="FORMLÆRE, hele teksten"><div class="stream" id="stream"></div></main>
  <nav class="pager">
    <button type="button" id="prev" aria-label="Førre">‹</button>
    <span class="pos" id="pos"></span>
    <button type="button" id="next" aria-label="Neste">›</button>
  </nav>
</div>

<script>
// WebKit can ignore user-scalable=no on iPhone. Suppress pinch gestures,
// but keep single-finger scrolling and reader controls entirely native.
(function preventPagePinch(){
  const stopIfMultitouch = event => {
    if (event.touches && event.touches.length > 1 && event.cancelable) {
      event.preventDefault();
    }
  };
  document.addEventListener('touchstart', stopIfMultitouch, {passive:false, capture:true});
  document.addEventListener('touchmove', stopIfMultitouch, {passive:false, capture:true});
  for (const name of ['gesturestart','gesturechange']) {
    document.addEventListener(name, event => {
      if (event.cancelable) event.preventDefault();
    }, {passive:false, capture:true});
  }
})();
function parseSource(src){
  const tokens=[],props=[];let active=null,buf=[];
  const flush=()=>{const t=buf.join("\n").trim();buf=[];if(!t)return;if(active)active.paragraphs.push(t);else tokens.push({kind:"paragraph",text:t});};
  for(const line of src.replace(/\r\n?/g,"\n").split("\n")){
    if(line.startsWith("## ")){flush();active=null;tokens.push({kind:"heading",text:line.slice(3).trim()});continue;}
    if(line.startsWith("# ")){flush();active=null;tokens.push({kind:"title",text:line.slice(2).trim()});continue;}
    const m=line.match(/^\*\*(\d+(?:\.\d+)*)([datio])\*\*\s+(.*)$/);
    if(m){flush();active={kind:"prop",n:m[1],status:m[2],paragraphs:[]};tokens.push(active);props.push(active);if(m[3])buf.push(m[3]);continue;}
    if(!line.trim()){flush();continue;}
    buf.push(line);
  }
  flush();
  return {tokens,props};
}
(async function siteInit(){
  const response=await fetch("/traktat/formlaere.txt",{cache:"no-store"});
  if(!response.ok)throw new Error("Kunne ikkje laste FORMLÆRE");
  const parsed=parseSource(await response.text()),DATA=parsed.props,TOKENS=parsed.tokens;
  if(DATA.length!==375||DATA[0]?.n!=="1"||DATA[DATA.length-1]?.n!=="7.4")throw new Error("Ufullstendig eller feil utgåve av FORMLÆRE");
  const byNum=new Map(DATA.map(d=>[d.n,d]));
  for(const d of DATA){d.kids=[];let p=d.n.slice(0,-1);while(p&&!byNum.has(p))p=p.slice(0,-1);d.parent=p||null;}
  for(const d of DATA){if(d.parent)byNum.get(d.parent).kids.push(d);}
  function depthOf(d){return d.parent?1+depthOf(byNum.get(d.parent)):0;}
  for(const d of DATA)d.depth=depthOf(d);
  const roots=DATA.filter(d=>!d.parent),order=DATA.map(d=>d.n);
  const byRow=new Map(),read=document.getElementById("read"),stream=document.getElementById("stream"),pos=document.getElementById("pos"),svg=document.getElementById("tree"),NS="http://www.w3.org/2000/svg";
  let current=order[0],hashTimer=0,scrollFrame=0,navUntil=0;
  const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  let addressWindow=window;
  try{if(window.parent!==window&&window.parent.location.hostname===window.location.hostname)addressWindow=window.parent;}catch(e){}
  function hashNumber(){try{return decodeURIComponent(addressWindow.location.hash.slice(1));}catch(e){return "";}}
  // A single transient preview for every reference: mouse hover, or first touch.
  const preview=document.createElement("aside");
  preview.className="prop-preview";
  preview.id="prop-preview";
  preview.setAttribute("role","tooltip");
  preview.hidden=true;
  document.body.appendChild(preview);
  let previewAnchor=null,previewMode="";
  function closePreview(){
    if(previewAnchor){
      previewAnchor.classList.remove("previewing");
      previewAnchor.removeAttribute("aria-describedby");
      previewAnchor.removeAttribute("aria-expanded");
    }
    previewAnchor=null;previewMode="";preview.hidden=true;
  }
  function showPreview(anchor,mode){
    const n=anchor.dataset.ref,d=byNum.get(n);
    if(!d)return;
    if(previewAnchor&&previewAnchor!==anchor)closePreview();
    previewAnchor=anchor;previewMode=mode;
    anchor.classList.add("previewing");
    anchor.setAttribute("aria-describedby","prop-preview");
    anchor.setAttribute("aria-expanded","true");
    const number=document.createElement("div");
    number.className="prop-preview-num";
    number.textContent=d.n+" · "+({d:"definisjon",a:"postulat",t:"teorem",o:"observasjon",i:"illustrasjon"}[d.status]||"");
    const body=document.createElement("div");
    body.className="prop-preview-body";
    const full=d.paragraphs.join("\n\n").replace(/\*{1,2}/g,"").trim();
    body.textContent=full.length>480?full.slice(0,477).trimEnd()+"…":full;
    const hint=document.createElement("div");
    hint.className="prop-preview-hint";
    hint.textContent=mode==="tap"?"Trykk på tilvisinga igjen for å gå dit":"Klikk for å gå til proposisjonen";
    preview.replaceChildren(number,body,hint);
    preview.hidden=false;
    const rect=anchor.getBoundingClientRect();
    const width=preview.getBoundingClientRect().width;
    const left=Math.max(12,Math.min(window.innerWidth-width-12,rect.left+rect.width/2-width/2));
    const height=preview.getBoundingClientRect().height;
    const roomAbove=rect.top-12,roomBelow=window.innerHeight-rect.bottom-12;
    let top=roomAbove>=height?rect.top-height-9:rect.bottom+9;
    if(top+height>window.innerHeight-8&&roomAbove>roomBelow)top=rect.top-height-9;
    preview.style.left=left+"px";
    preview.style.top=Math.max(8,Math.min(top,window.innerHeight-height-8))+"px";
  }
  function addLinkedText(el,text){
    // Only parenthesized proposition citations become links; numbers in
    // mathematical expressions, dates and note numbers stay untouched.
    const group=/\((\s*\d+(?:\.\d+)*(?:\s*[,;–—−-]\s*\d+(?:\.\d+)*)*\s*)\)/g;
    let start=0,m;
    while((m=group.exec(text))!==null){
      el.appendChild(document.createTextNode(text.slice(start,m.index)+"("));
      const inner=m[1],numberPattern=/\d+(?:\.\d+)*/g;
      let last=0,match;
      while((match=numberPattern.exec(inner))!==null){
        el.appendChild(document.createTextNode(inner.slice(last,match.index)));
        const n=match[0];
        if(byNum.has(n)){
          const link=document.createElement("button");
          link.type="button";link.className="xref";link.dataset.ref=n;
          link.textContent=n;
          link.setAttribute("aria-label","Vis proposisjon "+n);
          let pointerType="mouse";
          link.addEventListener("pointerdown",e=>{pointerType=e.pointerType;});
          link.addEventListener("touchstart",()=>{pointerType="touch";},{passive:true});
          link.addEventListener("pointerenter",e=>{
            if(e.pointerType==="mouse"||e.pointerType==="pen")showPreview(link,"hover");
          });
          link.addEventListener("pointerleave",e=>{
            if((e.pointerType==="mouse"||e.pointerType==="pen")&&previewAnchor===link&&previewMode==="hover")closePreview();
          });
          link.addEventListener("focus",()=>{
            if(link.matches(":focus-visible"))showPreview(link,"hover");
          });
          link.addEventListener("click",e=>{
            e.stopPropagation();e.preventDefault();
            if(pointerType==="touch"){
              if(previewAnchor===link&&previewMode==="tap"){closePreview();go(n);}
              else showPreview(link,"tap");
            }else{
              closePreview();go(n);
            }
          });
          el.appendChild(link);
        }else el.appendChild(document.createTextNode(n));
        last=match.index+n.length;
      }
      el.appendChild(document.createTextNode(inner.slice(last)+")"));
      start=group.lastIndex;
    }
    el.appendChild(document.createTextNode(text.slice(start)));
  }
  function rich(el,s){
    for(const part of s.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g)){
      if(!part)continue;
      if(part.startsWith("**")&&part.endsWith("**")){
        const b=document.createElement("strong");addLinkedText(b,part.slice(2,-2));el.appendChild(b);
      }else if(part.startsWith("*")&&part.endsWith("*")){
        const em=document.createElement("em");addLinkedText(em,part.slice(1,-1));el.appendChild(em);
      }else addLinkedText(el,part);
    }
  }
  // Dismiss previews on scrolling, tapping elsewhere, rotating or Escape.
  read.addEventListener("scroll",closePreview,{passive:true});
  document.addEventListener("pointerdown",e=>{
    if(previewAnchor&&!e.target.closest(".xref"))closePreview();
  },{capture:true});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closePreview();});
  window.addEventListener("resize",closePreview,{passive:true});
  function make(tag,cls,text){
    const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;
  }
  for(const tok of TOKENS){
    if(tok.kind==="title"){const h=make("h1","doc-title",tok.text);stream.appendChild(h);}
    else if(tok.kind==="heading"){const h=make("h2","section-title",tok.text);h.id="del-"+tok.text.toLowerCase().replace(/[^a-z0-9æøå]+/g,"-").replace(/^-|-$/g,"");stream.appendChild(h);}
    else if(tok.kind==="paragraph"){const p=make("p","plain-paragraph");rich(p,tok.text);stream.appendChild(p);}
    else if(tok.kind==="prop"){
      const row=make("article","prop depth"+Math.min(tok.depth,4));row.dataset.n=tok.n;row.id=tok.n;
      const n=make("span","n",tok.n);const sup=make("sup","status",tok.status);n.appendChild(sup);
      const body=make("div","t");for(const para of tok.paragraphs){const p=make("p","prop-paragraph");rich(p,para);body.appendChild(p);}
      row.append(n,body);row.addEventListener("click",()=>{if(!window.getSelection()?.toString())setCurrent(tok.n,true,false);});
      byRow.set(tok.n,row);stream.appendChild(row);
    }
  }
  stream.appendChild(make("div","endmark",order[order.length-1]+" · SLUTT"));
  const VW=358,PAD=5,SGAP=5,YROOT=17,YLAB=8,UNIT=75;
  const branches=roots.flatMap(r=>r.kids);
  const STEP=(VW-2*PAD-SGAP*(roots.length-1))/Math.max(1,branches.length);
  let x=PAD;
  for(const r of roots){r.x0=x;for(const b of r.kids){b.x=x+STEP/2;x+=STEP;}r.x1=x;x+=SGAP;}
  const VH=YROOT+UNIT+7;
  function ancestorBranch(d){
    if(!d||!d.parent)return null;
    while(d.parent&&byNum.get(d.parent)?.parent)d=byNum.get(d.parent);
    return d;
  }
  for(const b of branches)b.members=DATA.filter(d=>ancestorBranch(d)?.n===b.n);
  function mk(tag,attrs){const e=document.createElementNS(NS,tag);for(const key in attrs)e.setAttribute(key,attrs[key]);return e;}
  function drawTree(){
    svg.setAttribute("viewBox",`0 0 ${VW} ${VH}`);svg.innerHTML="";
    const sec=byNum.get(current)?.n[0]||"1",group=ancestorBranch(byNum.get(current));const g=mk("g",{});
    for(const r of roots){
      const on=r.n===sec;
      g.appendChild(mk("path",{d:`M${r.x0} ${YROOT} H${r.x1}`,class:"rbar"+(on?" on":"")}));
      const lab=mk("text",{x:(r.x0+r.x1)/2,y:YLAB,class:"rlab"+(on?" on":"")});lab.textContent=r.n;g.appendChild(lab);
      for(const b of r.kids){
        const isBranch=group&&group.n===b.n;
        const ht=12+Math.min(UNIT-14,6*Math.sqrt(b.members.length));
        g.appendChild(mk("path",{d:`M${b.x} ${YROOT} V${YROOT+ht}`,class:"stem"+(isBranch?" on":on?" sec":"")}));
        if(isBranch){const i=b.members.findIndex(d=>d.n===current);if(i>=0){const cy=YROOT+5+(i+.5)/Math.max(1,b.members.length)*(ht-5);g.appendChild(mk("circle",{cx:b.x,cy,r:2.5,class:"dot"}));}}
      }
    }
    svg.appendChild(g);
  }
  function paint(){
    for(const [n,el] of byRow)el.classList.toggle("active",n===current);
    const i=order.indexOf(current);pos.textContent=current+" · "+(i+1)+"/"+order.length;
    document.getElementById("prev").disabled=i===0;
    document.getElementById("next").disabled=i===order.length-1;
    drawTree();
  }
  function hashWrite(){
    clearTimeout(hashTimer);
    hashTimer=setTimeout(()=>{try{addressWindow.history.replaceState(null,"","#"+current);}catch(e){}},220);
  }
  function setCurrent(n,write=true,scroll=false,behavior="smooth"){
    if(!byNum.has(n))return;
    current=n;paint();if(write)hashWrite();
    if(scroll){const motion=reducedMotion.matches?"auto":behavior;navUntil=performance.now()+(motion==="smooth"?520:80);byRow.get(n)?.scrollIntoView({block:"start",behavior:motion});}
  }
  function go(n,behavior="smooth"){setCurrent(n,true,true,behavior);}
  function step(k){const i=order.indexOf(current)+k;if(i>=0&&i<order.length)go(order[i]);}
  document.getElementById("prev").addEventListener("click",()=>step(-1));
  document.getElementById("next").addEventListener("click",()=>step(1));
  function currentFromScroll(){
    if(performance.now()<navUntil)return;
    if(read.scrollTop<=2){if(current!==order[0])setCurrent(order[0]);return;}
    const line=read.getBoundingClientRect().top+32;
    let candidate=null;
    for(const n of order){
      const r=byRow.get(n).getBoundingClientRect();
      if(r.top<=line&&r.bottom>=line){candidate=n;break;}
      if(r.top>line){candidate=n;break;}
    }
    if(!candidate)candidate=order[order.length-1];
    if(candidate!==current)setCurrent(candidate);
  }
  read.addEventListener("scroll",()=>{if(scrollFrame)return;scrollFrame=requestAnimationFrame(()=>{scrollFrame=0;currentFromScroll();});},{passive:true});
  for(const ev of ["wheel","touchstart","keydown"])read.addEventListener(ev,()=>{navUntil=0;},{passive:true});
  let scrubbing=false,pending=null,raf=0;
  function atPoint(cx,cy){
    const r=svg.getBoundingClientRect();if(!r.width)return null;
    const u=(cx-r.left)/r.width*VW,v=(cy-r.top)/r.height*VH;
    let b=branches[0],dist=Infinity;
    for(const c of branches){const d=Math.abs(c.x-u);if(d<dist){dist=d;b=c;}}
    if(!b)return null;
    if(v<YROOT)return b.parent;
    const t=Math.max(0,Math.min(1,(v-YROOT)/UNIT));
    return (b.members[Math.min(b.members.length-1,Math.floor(t*b.members.length))]||b).n;
  }
  function scrubTo(cx,cy){
    const n=atPoint(cx,cy);if(!n||n===current)return;
    pending=n;if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(pending)go(pending,"auto");pending=null;});
  }
  svg.addEventListener("pointerdown",e=>{scrubbing=true;svg.setPointerCapture(e.pointerId);scrubTo(e.clientX,e.clientY);e.preventDefault();});
  svg.addEventListener("pointermove",e=>{if(scrubbing)scrubTo(e.clientX,e.clientY);});
  svg.addEventListener("pointerup",()=>{scrubbing=false;});
  svg.addEventListener("pointercancel",()=>{scrubbing=false;});
  let sx=0,sy=0,tracking=false;
  read.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;}},{passive:true});
  read.addEventListener("touchend",e=>{if(!tracking)return;tracking=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>64&&Math.abs(dy)<44)step(dx<0?1:-1);},{passive:true});
  const h=hashNumber();if(byNum.has(h))current=h;
  paint();if(byNum.has(h))requestAnimationFrame(()=>go(h,"auto"));
  addressWindow.addEventListener("hashchange",()=>{const n=hashNumber();if(byNum.has(n))setCurrent(n,false,true,"auto");});
})().catch(err=>{const read=document.getElementById("read");if(read)read.textContent="Klarte ikkje laste FORMLÆRE.";console.error(err);});
