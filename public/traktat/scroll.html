<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORMLÆRE">
<title>FORMLÆRE — Iver Raknes Finne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..400;1,7..72,300..400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --bg:#FFFFFF;
  --fg:#000000;
  --dim:#767676;
  --line:#D2D2D2;
  --hair:#E8E8E8;
  --serif:"Literata",Charter,Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#FFFFFF; --dim:#7C7C7C; --line:#343434; --hair:#1C1C1C;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#FFFFFF; --dim:#7C7C7C; --line:#343434; --hair:#1C1C1C;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{
  margin:0;background:var(--bg);color:var(--fg);
}
body{
  font-family:var(--serif);font-size:.90625rem;line-height:1.47;
  font-weight:400;font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:text;user-select:text;
}

.app{
  min-height:100vh;
  max-width:520px;margin:0 auto;
  border-left:1px solid var(--hair);border-right:1px solid var(--hair);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (max-width:522px){.app{border:0}}

/* ---- top ---- */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:calc(var(--top) + 6px) 16px 4px;
  font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--dim);
}
.bar a{display:inline-flex;align-items:center;min-height:28px;color:inherit;text-decoration:none}
.bar a:hover{color:var(--fg)}
.bar a:focus-visible{outline:1px solid var(--dim);outline-offset:3px}
.continue-reading{margin:1.5rem 0 .5rem;font:400 .72rem var(--mono)}
.continue-reading a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line);padding:.4rem 0}
.continue-reading a:focus-visible{outline:1px solid var(--dim);outline-offset:3px}

/* ---- tree strip ---- */
.strip{padding:1px 14px 8px;border-bottom:1px solid var(--hair)}
.strip[hidden]{display:none}
.strip svg{display:block;width:100%;height:auto;overflow:visible;touch-action:none}
.strip{-webkit-user-select:none;user-select:none}
.rbar{stroke:var(--line);stroke-width:1.1;fill:none;stroke-linecap:round}
.rbar.on{stroke:var(--dim)}
.stem{stroke:var(--line);stroke-width:.9;fill:none}
.stem.sec{stroke:var(--dim)}
.stem.on{stroke:var(--fg);stroke-width:1.2}
.dot{fill:var(--fg)}
.rlab{font-family:var(--mono);font-size:9px;fill:var(--dim);text-anchor:middle}
.rlab.on{fill:var(--fg)}
.tap{fill:transparent}


/* ---- reading / continuous stream ---- */
.read{padding:0 1.2rem calc(1.5rem + var(--bot)) .5rem}
.read:focus-visible{outline:1px solid var(--dim);outline-offset:-1px}
.stream{padding:.375rem 0 1.25rem}
.section-title{font-family:var(--serif);font-size:1.15rem;font-weight:400;line-height:1.3;margin:2.4rem 0 .8rem;padding-top:.65rem;border-top:1px solid var(--hair);scroll-margin-top:12px}
.section-title:first-child{margin-top:.65rem;padding-top:0;border-top:0}
.plain-paragraph{font-size:.90rem;line-height:1.49;font-weight:400;white-space:pre-line;margin:.67rem 0;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.plain-paragraph em,.prop em{font-style:italic}.plain-paragraph strong,.prop strong{font-weight:600}
.prop{position:relative;display:grid;grid-template-columns:3rem minmax(0,1fr);gap:0 .35rem;align-items:start;width:100%;min-width:0;font-size:.93rem;line-height:1.45;font-weight:400;padding:.18rem 0;scroll-margin-top:12px}
.prop .n{font-family:var(--mono);font-size:.69rem;line-height:1.4;padding-top:.15rem;color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:left}
.prop .status{font-size:.58rem;margin-left:.05rem;font-weight:400}
.prop .t{font:inherit;min-width:0;width:100%;letter-spacing:0;text-wrap:pretty;text-align:left;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;-webkit-user-select:text;user-select:text}
.prop-paragraph{white-space:pre-line;margin:0;max-width:none}.prop-paragraph+.prop-paragraph{margin-top:.57em}
/* One fixed left edge for every proposition. Depth is communicated by
   the interactive proposition tree above the text, never by indentation. */
.prop.depth0{margin-left:0;font-size:.97rem;line-height:1.45;font-weight:400;margin-top:1.10rem;padding-top:.18rem}
.prop.depth1{margin-left:0;font-size:.93rem;margin-top:.78rem}
.prop.depth2{margin-left:0;margin-top:.48rem}
.prop.depth3{margin-left:0;margin-top:.34rem}
.prop.depth4{margin-left:0;margin-top:.24rem}
.prop.active .n{color:var(--fg);font-weight:500}

/* Book drawings live in the normal text stream, never in a floating overlay. */
.figure-set{display:flex;flex-direction:column;align-items:flex-start;gap:.7rem;width:calc(100% - 3.35rem);max-width:calc(100% - 3.35rem);min-width:0;margin:.5rem 0 1.65rem 3.35rem;padding:0}
.tractate-figure{margin:0;padding:0;max-width:100%;width:100%;text-align:left}
.tractate-figure img{display:block;width:100%;max-width:100%;height:auto;object-fit:contain;object-position:left center}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .tractate-figure img{filter:invert(1)}
}
:root[data-theme="dark"] .tractate-figure img{filter:invert(1)}

/* References are in-text, and the preview is anchored to the number. */
.xref{
  display:inline;color:inherit;background:transparent;border:0;border-radius:0;
  margin:0;padding:0;font:inherit;line-height:inherit;cursor:pointer;vertical-align:baseline;
  text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--dim);
  text-decoration-thickness:1px;text-underline-offset:.16em;touch-action:manipulation;
  -webkit-appearance:none;-webkit-tap-highlight-color:transparent;
}
.xref:hover,.xref:focus-visible,.xref.previewing{
  text-decoration-style:solid;text-decoration-color:var(--fg);
}
.xref:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.prop-preview{
  position:fixed;z-index:9999;box-sizing:border-box;
  width:min(302px,calc(100vw - 24px));padding:9px 11px;
  color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.17);
  pointer-events:none;font-family:var(--serif);font-size:.81rem;line-height:1.39;
  text-align:left;overflow-wrap:break-word;
}
.prop-preview[hidden]{display:none!important}
.prop-preview-num{font-family:var(--mono);font-size:.75rem;font-weight:500;margin-bottom:3px}
.prop-preview-body{white-space:pre-line;max-height:min(26vh,180px);overflow:hidden}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .prop-preview{box-shadow:0 8px 30px rgba(0,0,0,.6)}
}
:root[data-theme="dark"] .prop-preview{box-shadow:0 8px 30px rgba(0,0,0,.6)}

/* Endnotes belong to the document, with the same left edge as the text. */
.endmatter{margin-top:3rem;scroll-margin-top:1rem}
.endmatter .section-title{margin-bottom:.8rem}
.endmatter-list{list-style:none;margin:0;padding:0}
.endnote{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:.35rem;padding:.45rem 0;font-size:.81rem;line-height:1.45;scroll-margin-top:1rem}
.endnote-number{font:400 .65rem var(--mono);color:var(--dim);padding-top:.12rem}
.endnote-body{min-width:0;overflow-wrap:anywhere}
.endnote-body p{margin:0}.endnote-body p+p{margin-top:.3rem}
.endnote-meta{font:400 .62rem var(--mono);color:var(--dim);margin-bottom:.25rem}
.endnote a{color:inherit;text-underline-offset:.16em}
.source-links{font:400 .65rem var(--mono)}
.source-ref{font-family:var(--mono);font-size:.63em;line-height:0;vertical-align:super;text-decoration:none;padding:0 .1em}
.source-ref .xref{display:inline-block;line-height:1;padding:.2em .1em;margin:-.2em 0}
.note-ref{display:inline-block;margin-left:.3em;color:var(--dim);font-family:var(--mono);font-size:.62em;line-height:1;vertical-align:super}
@media print{
  @page{margin:16mm 14mm}
  :root{--bg:#fff;--fg:#000;--dim:#555;--line:#bbb;--hair:#ddd}
  .app{max-width:none;min-height:0;margin:0;border:0;padding:0}
  .bar,.strip,.prop-preview{display:none!important}
  .read{padding:0}.stream{padding:0}
  .prop,.plain-paragraph{font-size:10.5pt;line-height:1.42}
  .prop .n{font-size:8pt}
  .endmatter{break-before:page}
  .endnote{break-inside:avoid;font-size:9pt}
  p{orphans:3;widows:3}
  .xref{text-decoration:none}
  .tractate-figure{break-inside:avoid}
  .tractate-figure img{filter:none!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .read{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="app">
  <nav class="bar" aria-label="Dokument og nettstad">
    <a href="/traktat/formlaere.pdf" download="formlære.pdf" type="application/pdf" aria-label="Last ned formlære.pdf, utskriftsversjonen">formlære.pdf</a>
    <a href="https://iverfinne.no">iverfinne.no</a>
  </nav>
  <div class="strip"><svg id="tree" role="img" aria-label="Traktatens tre"></svg></div>
  <main class="read" id="read" tabindex="0" aria-label="FORMLÆRE, heile teksten"><div class="stream" id="stream"></div></main>

</div>

<script>
function parseSource(src){
  const tokens=[],props=[];let active=null,buf=[];
  const flush=()=>{const t=buf.join("\n").trim();buf=[];if(!t)return;if(active)active.paragraphs.push(t);else tokens.push({kind:"paragraph",text:t});};
  for(const line of src.replace(/\r\n?/g,"\n").split("\n")){
    if(line.startsWith("## ")){flush();active=null;tokens.push({kind:"heading",text:line.slice(3).trim()});continue;}
    if(line.startsWith("# ")){flush();active=null;tokens.push({kind:"title",text:line.slice(2).trim()});continue;}
    const m=line.match(/^\*\*(\d+(?:\.\d+)*)([datio])\*\*\s+(.*)$/);
    if(m){flush();active={kind:"prop",n:m[1],status:m[2],paragraphs:[]};tokens.push(active);props.push(active);if(m[3])buf.push(m[3]);continue;}
    if(!line.trim()){flush();continue;}
    buf.push(line);
  }
  flush();
  return {tokens,props};
}
(async function siteInit(){
  const forewordView=window.location.pathname==="/";
  if(forewordView&&/^#(?:\d|notat|referanse)/.test(window.location.hash)){
    window.location.replace("/les"+window.location.hash);return;
  }
  const [response,supplement]=await Promise.all([
    fetch("/traktat/formlaere.txt",{cache:"no-store"}),
    Promise.all(["kjelder.json","citations.json"].map(async file=>{
      const r=await fetch("/traktat/"+file,{cache:"no-store"});
      if(!r.ok)throw new Error("Kunne ikkje laste "+file);
      return r.json();
    })).catch(err=>{console.error(err);return null;})
  ]);
  if(!response.ok)throw new Error("Kunne ikkje laste FORMLÆRE");
  const parsed=parseSource(await response.text()),DATA=parsed.props,TOKENS=parsed.tokens;
  if(DATA.length!==375||DATA[0]?.n!=="1"||DATA[DATA.length-1]?.n!=="7.4")throw new Error("Ufullstendig eller feil utgåve av FORMLÆRE");
  const byNum=new Map(DATA.map(d=>[d.n,d]));
  for(const d of DATA){d.kids=[];let p=d.n.slice(0,-1);while(p&&!byNum.has(p))p=p.slice(0,-1);d.parent=p||null;}
  for(const d of DATA){if(d.parent)byNum.get(d.parent).kids.push(d);}
  function depthOf(d){return d.parent?1+depthOf(byNum.get(d.parent)):0;}
  for(const d of DATA)d.depth=depthOf(d);
  const roots=DATA.filter(d=>!d.parent),order=DATA.map(d=>d.n);
  const byRow=new Map(),read=document.getElementById("read"),stream=document.getElementById("stream"),svg=document.getElementById("tree"),NS="http://www.w3.org/2000/svg";
  let current=order[0],hashTimer=0,scrollFrame=0,navUntil=0;
  const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  const catalog=supplement?.[0],citationIndex=new Map((supplement?.[1]?.entries||[]).map(p=>[p.paragraph,p.spans]));
  const sources=new Map((catalog?.sources||[]).map(s=>[String(s.id),s]));
  const notes=(catalog?.annotations||[]).filter(note=>byNum.has(note.proposition)).sort((a,b)=>order.indexOf(a.proposition)-order.indexOf(b.proposition));
  const introNotes=(catalog?.intro||[]).filter(note=>TOKENS.some(tok=>tok.kind==="paragraph"&&tok.text.includes(note.anchor)));
  const allNotes=[...introNotes,...notes];
  function sourceButton(id){
    const link=make("a","xref",id);link.href=(forewordView?"/les":"")+"#referanse-"+id;
    link.setAttribute("aria-label","Til referanse "+id);
    link.addEventListener("click",e=>{clearTimeout(hashTimer);e.stopPropagation();closePreview();});
    return link;
  }
  function appendSources(el,ids){
    ids.forEach((id,index)=>{if(index)el.appendChild(document.createTextNode(", "));el.appendChild(sourceButton(String(id)));});
  }
  function appendEndmatter(){
    for(const [kind,title,items] of [["notat","Notat",allNotes],["referansar","Referansar",[...sources.values()]]]){
      const section=make("section","endmatter");section.id=kind;
      const heading=make("h2","section-title",title);heading.id=kind+"-tittel";
      section.setAttribute("aria-labelledby",heading.id);section.appendChild(heading);
      const list=make("ol","endmatter-list");
      items.forEach((item,index)=>{
        const isNote=kind==="notat",number=isNote?index+1:item.id;
        const entry=make("li","endnote");entry.id=(isNote?"notat-":"referanse-")+number;
        entry.appendChild(make("span","endnote-number",isNote?"n"+number:String(number)));
        const body=make("div","endnote-body");
        if(isNote){
          const meta=make("div","endnote-meta");
          const back=make("a","xref",item.proposition||"Føreord");
          back.href=item.proposition?"#"+item.proposition:"/";
          back.setAttribute("aria-label",item.proposition?"Til proposisjon "+item.proposition:"Til føreordet");
          meta.appendChild(back);
          if(item.relation)meta.appendChild(document.createTextNode(" · "+item.relation));
          body.appendChild(meta);body.appendChild(make("p","",item.note));
          const refs=make("p","source-links","[");appendSources(refs,item.sources||[]);refs.appendChild(document.createTextNode("]"));body.appendChild(refs);
        }else{
          body.appendChild(make("p","",item.citation));
          const url=item.url||(item.doi?"https://doi.org/"+item.doi:null);
          if(url){try{const parsedUrl=new URL(url);if(["https:","http:"].includes(parsedUrl.protocol)){
            const link=make("a","source-links",item.doi?"DOI: "+item.doi:"Opne kjelda");link.href=parsedUrl.href;link.target="_blank";link.rel="noopener noreferrer";body.appendChild(link);
          }}catch(e){}}
        }
        entry.appendChild(body);list.appendChild(entry);
      });
      section.appendChild(list);stream.appendChild(section);
    }
  }
  let addressWindow=window;
  try{if(window.parent!==window&&window.parent.location.hostname===window.location.hostname)addressWindow=window.parent;}catch(e){}
  function hashNumber(){try{return decodeURIComponent(addressWindow.location.hash.slice(1));}catch(e){return "";}}
  // A single transient preview for every reference: mouse hover, or first touch.
  const preview=document.createElement("aside");
  preview.className="prop-preview";
  preview.id="prop-preview";
  preview.setAttribute("role","tooltip");
  preview.hidden=true;
  document.body.appendChild(preview);
  let previewAnchor=null,previewMode="";
  function closePreview(){
    if(previewAnchor){
      previewAnchor.classList.remove("previewing");
      previewAnchor.removeAttribute("aria-describedby");
      previewAnchor.removeAttribute("aria-expanded");
    }
    previewAnchor=null;previewMode="";preview.hidden=true;
  }
  function showPreview(anchor,mode){
    const n=anchor.dataset.ref,d=byNum.get(n);
    if(!d)return;
    if(previewAnchor&&previewAnchor!==anchor)closePreview();
    previewAnchor=anchor;previewMode=mode;
    anchor.classList.add("previewing");
    anchor.setAttribute("aria-describedby","prop-preview");
    anchor.setAttribute("aria-expanded","true");
    const number=document.createElement("div");
    number.className="prop-preview-num";
    number.textContent=d.n+" · "+({d:"definisjon",a:"postulat",t:"teorem",o:"observasjon",i:"illustrasjon"}[d.status]||"");
    const body=document.createElement("div");
    body.className="prop-preview-body";
    const full=d.paragraphs.join("\n\n").replace(/\*{1,2}/g,"").trim();
    body.textContent=full.length>335?full.slice(0,332).trimEnd()+"…":full;
    preview.replaceChildren(number,body);
    preview.hidden=false;
    const rect=anchor.getBoundingClientRect();
    const width=preview.getBoundingClientRect().width;
    const left=Math.max(12,Math.min(window.innerWidth-width-12,rect.left+rect.width/2-width/2));
    const height=preview.getBoundingClientRect().height;
    const roomAbove=rect.top-12,roomBelow=window.innerHeight-rect.bottom-12;
    let top=roomAbove>=height?rect.top-height-9:rect.bottom+9;
    if(top+height>window.innerHeight-8&&roomAbove>roomBelow)top=rect.top-height-9;
    preview.style.left=left+"px";
    preview.style.top=Math.max(8,Math.min(top,window.innerHeight-height-8))+"px";
  }
  function addLinkedText(el,text){
    // Only parenthesized proposition citations become links; numbers in
    // mathematical expressions, dates and note numbers stay untouched.
    const group=/\((\s*\d+(?:\.\d+)*(?:\s*[,;–—−-]\s*\d+(?:\.\d+)*)*\s*)\)/g;
    let start=0,m;
    while((m=group.exec(text))!==null){
      el.appendChild(document.createTextNode(text.slice(start,m.index)+"("));
      const inner=m[1],numberPattern=/\d+(?:\.\d+)*/g;
      let last=0,match;
      while((match=numberPattern.exec(inner))!==null){
        el.appendChild(document.createTextNode(inner.slice(last,match.index)));
        const n=match[0];
        if(byNum.has(n)){
          const link=document.createElement("button");
          link.type="button";link.className="xref";link.dataset.ref=n;
          link.textContent=n;
          link.setAttribute("aria-label","Vis proposisjon "+n);
          let pointerType="mouse";
          link.addEventListener("pointerdown",e=>{pointerType=e.pointerType;});
          link.addEventListener("touchstart",()=>{pointerType="touch";},{passive:true});
          link.addEventListener("pointerenter",e=>{
            if(e.pointerType==="mouse"||e.pointerType==="pen")showPreview(link,"hover");
          });
          link.addEventListener("pointerleave",e=>{
            if((e.pointerType==="mouse"||e.pointerType==="pen")&&previewAnchor===link&&previewMode==="hover")closePreview();
          });
          link.addEventListener("focus",()=>{
            if(link.matches(":focus-visible"))showPreview(link,"hover");
          });
          link.addEventListener("click",e=>{
            e.stopPropagation();e.preventDefault();
            if(pointerType==="touch"){
              if(previewAnchor===link&&previewMode==="tap"){closePreview();go(n);}
              else showPreview(link,"tap");
            }else{
              closePreview();go(n);
            }
          });
          el.appendChild(link);
        }else el.appendChild(document.createTextNode(n));
        last=match.index+n.length;
      }
      el.appendChild(document.createTextNode(inner.slice(last)+")"));
      start=group.lastIndex;
    }
    el.appendChild(document.createTextNode(text.slice(start)));
  }
  function richText(el,s){
    for(const part of s.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g)){
      if(!part)continue;
      if(part.startsWith("**")&&part.endsWith("**")){
        const b=document.createElement("strong");addLinkedText(b,part.slice(2,-2));el.appendChild(b);
      }else if(part.startsWith("*")&&part.endsWith("*")){
        const em=document.createElement("em");addLinkedText(em,part.slice(1,-1));el.appendChild(em);
      }else addLinkedText(el,part);
    }
  }
  function rich(el,s){
    // Exact source spans are reviewed separately; never guess citations from
    // ordinary numbers, proposition references or mathematical superscripts.
    const citations=citationIndex.get(s)||[];let cursor=0;
    for(const citation of citations){
      const at=citation.start;
      if(at<cursor||s.slice(at,citation.end)!==citation.text)continue;
      richText(el,s.slice(cursor,at));
      const sup=make("sup","source-ref");appendSources(sup,citation.sourceIds);el.appendChild(sup);
      cursor=citation.end;
    }
    richText(el,s.slice(cursor));
  }
  function addNoteLinks(el,items){
    for(const item of items){const index=allNotes.indexOf(item)+1;
      const link=make("a","xref note-ref","n"+index);link.href=(forewordView?"/les":"")+"#notat-"+index;
      link.setAttribute("aria-label","Til notat "+index);
      link.addEventListener("click",e=>{clearTimeout(hashTimer);e.stopPropagation();closePreview();});el.appendChild(link);
    }
  }
  // Dismiss previews on scrolling, tapping elsewhere, rotating or Escape.
  window.addEventListener("scroll",closePreview,{passive:true});
  document.addEventListener("pointerdown",e=>{
    if(previewAnchor&&!e.target.closest(".xref"))closePreview();
  },{capture:true});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closePreview();});
  window.addEventListener("resize",closePreview,{passive:true});
  function make(tag,cls,text){
    const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;
  }
