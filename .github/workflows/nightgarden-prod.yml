name: Night Garden production deploy
on:
  push:
    branches: [nightgarden-prod-20260921]
    paths:
      - '.nightgarden-deploy/**'
      - '.github/workflows/nightgarden-prod.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment payload
        uses: actions/checkout@v4

      - name: Deploy prebuilt Night Garden to gitless Vercel project
        working-directory: .nightgarden-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --yes \
            --token "$VERCEL_TOKEN" \
            --scope iverfinnes-projects
